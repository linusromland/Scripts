- name: Check if kubelet is installed
  ansible.builtin.stat:
    path: /usr/bin/kubelet
  register: kubelet_check

- name: Kubernetes node setup (only if kubelet not installed)
  when: not kubelet_check.stat.exists
  block:
    - name: Check CPU core count
      ansible.builtin.command: nproc
      register: cpu_count
      changed_when: false

    - name: Check total memory in MB
      ansible.builtin.command: cat /proc/meminfo
      register: meminfo
      changed_when: false

    - name: Extract total memory in MB
      ansible.builtin.set_fact:
        mem_total_mb: "{{ (meminfo.stdout_lines | select('search', '^MemTotal:') | first).split()[1] | int // 1024 }}"

    - name: Fail if CPU count is less than 2
      ansible.builtin.fail:
        msg: "Host does not meet minimum CPU requirements (2 cores needed). Found: {{ cpu_count.stdout }}"
      when: cpu_count.stdout | int < 2

    - name: Fail if memory is less than 1024 MB
      ansible.builtin.fail:
        msg: "Memory ({{ mem_total_mb }}) is less than the required 1024 MB."
      when: (mem_total_mb | int) < 1024

    - name: Get current swap status
      ansible.builtin.command: swapon --summary
      register: swap_status
      changed_when: false
      failed_when: false

    - name: Disable swap if it's enabled
      ansible.builtin.command: swapoff -a
      when: swap_status.stdout != ""
      changed_when: true

    - name: Ensure swap is disabled on boot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#]*\s+swap\s+)'
        replace: '#\1'

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Set sysctl params
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { key: net.bridge.bridge-nf-call-iptables, value: 1 }
        - { key: net.ipv4.ip_forward, value: 1 }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: 1 }

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true

    - name: Create default containerd config
      ansible.builtin.command: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes public signing key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Create Kubernetes keyring file from Release.key
      ansible.builtin.command: >
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Set permissions on Kubernetes keyring
      ansible.builtin.file:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        mode: "0644"

    - name: Add Kubernetes apt repository list
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /"
        mode: "0644"

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
