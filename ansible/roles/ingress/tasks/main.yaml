- name: Create ClusterIssuer for Let's Encrypt (staging)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ letsencrypt_issuer_staging }}"
      spec:
        acme:
          email: "{{ letsencrypt_email }}"
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: "{{ letsencrypt_issuer_staging }}"
          solvers:
            - http01:
                ingress:
                  class: traefik
  become: true

- name: Create ClusterIssuer for Let's Encrypt (production)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ letsencrypt_issuer_prod }}"
      spec:
        acme:
          email: "{{ letsencrypt_email }}"
          server: https://acme-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: "{{ letsencrypt_issuer_prod }}"
          solvers:
            - http01:
                ingress:
                  class: traefik
  become: true

- name: Create Argo CD ingress
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd-server-ingress
        namespace: argocd
        annotations:
          kubernetes.io/ingress.class: traefik
          cert-manager.io/cluster-issuer: "{{ letsencrypt_issuer_prod }}"
      spec:
        rules:
          - host: "{{ argocd_domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 80
        tls:
          - hosts:
              - "{{ argocd_domain }}"
            secretName: "{{ argocd_tls_secret }}"
  become: true
