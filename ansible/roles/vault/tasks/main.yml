- name: Create namespace for Vault
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ vault_namespace }}"
    state: present
    validate_certs: false
  become: true

- name: Add HashiCorp Helm repository
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com
  become: true

- name: Install HashiCorp Vault via Helm
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    chart_version: "{{ vault_helm_chart_version }}"
    release_namespace: "{{ vault_namespace }}"
    create_namespace: false
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      injector:
        enabled: true
      server:
        ha:
          enabled: false
  become: true

- name: Wait for Vault pod to be Ready
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: Pod
    namespace: "{{ vault_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=vault
    validate_certs: false
  register: vault_pods
  until: >
    vault_pods.resources |
    selectattr('status.conditions', 'defined') |
    selectattr('status.conditions', 'select',
      'cond -> cond | selectattr("type", "equalto", "Ready") | selectattr("status", "equalto", "True") | list | length > 0'
    ) | list | length > 0
  retries: 20
  delay: 6

- name: Check if Vault is initialized
  uri:
    url: "{{ vault_addr }}/v1/sys/init"
    method: GET
    validate_certs: false
  register: vault_init_status
  retries: 10
  delay: 5
  until: vault_init_status.status == 200

- name: Initialize Vault if not initialized
  when: not vault_init_status.json.initialized
  uri:
    url: "{{ vault_addr }}/v1/sys/init"
    method: PUT
    body_format: json
    body:
      secret_shares: 5
      secret_threshold: 3
    validate_certs: false
  register: vault_init_output

- name: Set Vault unseal keys and root token facts
  when: vault_init_output is defined
  set_fact:
    vault_unseal_keys: "{{ vault_init_output.json.keys_b64 }}"
    vault_root_token: "{{ vault_init_output.json.root_token }}"

- name: Fail if Vault is not initialized and init output missing
  when: (not vault_init_status.json.initialized) and (vault_init_output is not defined)
  fail:
    msg: "Vault is not initialized and no init output was generated."

- name: Check if Vault is sealed
  uri:
    url: "{{ vault_addr }}/v1/sys/seal-status"
    method: GET
    validate_certs: false
  register: vault_seal_status
  retries: 10
  delay: 6
  until: vault_seal_status.status == 200

- name: Unseal Vault with keys
  when: vault_seal_status.json.sealed
  block:
    - name: Unseal Vault by submitting unseal keys
      uri:
        url: "{{ vault_addr }}/v1/sys/unseal"
        method: POST
        body_format: json
        body:
          key: "{{ item }}"
        validate_certs: false
      loop: "{{ vault_unseal_keys }}"
      register: unseal_results
      until: unseal_results.results[-1].json.sealed == false
      retries: 5
      delay: 5

- name: Wait for Vault API to become ready
  uri:
    url: "{{ vault_addr }}/v1/sys/health"
    method: GET
    validate_certs: false
    status_code: 200
  register: vault_health
  until: vault_health.status == 200
  retries: 15
  delay: 4

- name: Enable Kubernetes auth method via API
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_root_token }}"
    path: "sys/auth/{{ vault_auth_path }}"
    method: POST
    data:
      type: kubernetes
    validate_certs: false

- name: Configure Kubernetes auth
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_root_token }}"
    path: "auth/{{ vault_auth_path }}/config"
    method: POST
    data:
      token_reviewer_jwt: "{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token') }}"
      kubernetes_host: "https://kubernetes.default.svc"
      kubernetes_ca_cert: "{{ vault_ca_cert }}"
    validate_certs: false

- name: Write Vault policy via API
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_root_token }}"
    path: "sys/policy/{{ vault_policy_name }}"
    method: PUT
    data:
      policy: |
        path "secret/data/*" {
          capabilities = ["read"]
        }
    validate_certs: false

- name: Create Vault role for Argo CD via API
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_root_token }}"
    path: "auth/{{ vault_auth_path }}/role/{{ vault_policy_name }}"
    method: POST
    data:
      bound_service_account_names: "{{ vault_service_account }}"
      bound_service_account_namespaces: "argocd"
      policies: "{{ vault_policy_name }}"
      ttl: "24h"
    validate_certs: false

- name: Create Ingress for Vault UI
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: vault-ui
        namespace: "{{ vault_namespace }}"
        annotations:
          kubernetes.io/ingress.class: traefik
          cert-manager.io/cluster-issuer: "{{ letsencrypt_issuer_prod }}"
      spec:
        rules:
          - host: "{{ vault_domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: vault
                      port:
                        number: 8200
        tls:
          - hosts:
              - "{{ vault_domain }}"
            secretName: "{{ vault_tls_secret }}"
  become: true
