- name: Create namespace for Vault
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ vault_namespace }}"
    state: present
    validate_certs: false
  become: true

- name: Add HashiCorp Helm repository
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com
  become: true


- name: Install HashiCorp Vault via Helm
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    chart_version: "{{ vault_helm_chart_version }}"
    release_namespace: "{{ vault_namespace }}"
    create_namespace: false
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      injector:
        enabled: true
      server:
        ha:
          enabled: false
        dev:
          enabled: true # TODO: DISABLE THIS SHIT
  become: true

- name: Wait for Vault pod to be ready
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: Pod
    namespace: "{{ vault_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=vault
    validate_certs: false
  register: vault_pods
  until: vault_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
  retries: 10
  delay: 6

- name: Enable Kubernetes auth method
  ansible.builtin.command:
    cmd: >
      vault auth enable -path={{ vault_auth_path }} kubernetes
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_SKIP_VERIFY: "true"
  when: inventory_hostname == groups['k3s_server'][0]
  delegate_to: localhost

- name: Configure Vault Kubernetes auth
  ansible.builtin.command:
    cmd: >
      vault write auth/{{ vault_auth_path }}/config
      token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      kubernetes_host="https://kubernetes.default.svc"
      kubernetes_ca_cert="{{ vault_ca_cert }}"
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_SKIP_VERIFY: "true"
  delegate_to: localhost

- name: Create Vault policy
  ansible.builtin.copy:
    dest: /tmp/{{ vault_policy_name }}.hcl
    content: |
      path "secret/data/*" {
        capabilities = ["read"]
      }
  delegate_to: localhost

- name: Load Vault policy
  ansible.builtin.command:
    cmd: vault policy write {{ vault_policy_name }} /tmp/{{ vault_policy_name }}.hcl
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_SKIP_VERIFY: "true"
  delegate_to: localhost

- name: Create Vault role for Argo CD
  ansible.builtin.command:
    cmd: >
      vault write auth/{{ vault_auth_path }}/role/{{ vault_policy_name }}
      bound_service_account_names={{ vault_service_account }}
      bound_service_account_namespaces=argocd
      policies={{ vault_policy_name }}
      ttl=24h
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_SKIP_VERIFY: "true"
  delegate_to: localhost

- name: Create Ingress for Vault UI
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: vault-ui
        namespace: "{{ vault_namespace }}"
        annotations:
          kubernetes.io/ingress.class: traefik
          cert-manager.io/cluster-issuer: "{{ letsencrypt_issuer_prod }}"
      spec:
        rules:
          - host: "{{ vault_domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: vault
                      port:
                        number: 8200
        tls:
          - hosts:
              - "{{ vault_domain }}"
            secretName: "{{ vault_tls_secret }}"
  become: true
